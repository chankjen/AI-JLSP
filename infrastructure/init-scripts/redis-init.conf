# ============================================================================
# Redis Configuration - AI-JLSP
# Session management, DPA consent cache, rate limiting
# ============================================================================

# General settings
port 6379
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence (optional for dev)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Limits
maxclients 10000
maxmemory 512mb
maxmemory-policy allkeys-lru

# AOF (Append Only File - for DPA Sec 31: Immutability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security
requirepass CHANGE_ME_IN_PRODUCTION

# Client output buffer limits (for rate limiting)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Notification for keyspace events
notify-keyspace-events "Keg$"

# Thresholds for key expiry (DPA Consent TTL)
hz 10
dynamic-hz yes

# End of Redis configuration
